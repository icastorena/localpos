openapi: 3.0.3
info:
  title: LocalPOS Order Service API
  version: 1.0.0
  description: |
    This API manages orders, payments, inventory, and closures for the LocalPOS system.
    All endpoints require JWT Bearer authentication.

servers:
  - url: http://localhost:8084/api/v1
    description: Base URL for Order Service API

security:
  - bearerAuth: []

tags:
  - name: Orders
    description: Operations related to order management
  - name: Closures
    description: Operations related to cash register closures

paths:
  /orders:
    post:
      tags: [Orders]
      summary: Create a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
            example:
              storeId: "1bb3b69f-62d2-4b52-b8c2-8355057e8d60"
              userId: "b2cb3e13-6b32-4b81-8a37-fc0b37aa5db4"
              items:
                - productId: "7eaba064-6513-4b93-8568-7f1ee49d91a5"
                  quantity: 2
              orderType: "SALE"
              paymentMethod: "CASH"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"

    get:
      tags: [Orders]
      summary: List orders by store and optional status
      parameters:
        - in: query
          name: storeId
          required: true
          schema:
            type: string
        - in: query
          name: status
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderSummaryResponse"

  /orders/{orderId}:
    get:
      tags: [Orders]
      summary: Retrieve order by ID
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"

  /orders/{orderId}/pay:
    post:
      tags: [Orders]
      summary: Pay for an order
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayOrderRequest"
      responses:
        "200":
          description: Paid order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"

  /orders/{orderId}/cancel:
    post:
      tags: [Orders]
      summary: Cancel an order
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Order canceled

  /closures:
    get:
      tags: [Closures]
      summary: List closures by optional filters
      parameters:
        - in: query
          name: storeId
          schema:
            type: string
        - in: query
          name: userId
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: dateFrom
          schema:
            type: string
            format: date
        - in: query
          name: dateTo
          schema:
            type: string
            format: date
      responses:
        "200":
          description: List of closures
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClosureResponse"

    post:
      tags: [Closures]
      summary: Create a new closure
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClosureRequest"
      responses:
        "201":
          description: Created closure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClosureResponse"

  /closures/{closureId}:
    get:
      tags: [Closures]
      summary: Retrieve closure by ID
      parameters:
        - in: path
          name: closureId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Closure details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClosureResponse"
  
  /closures/{id}/status:
    patch:
      tags: [Closures]
      summary: Update closure status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClosureStatusRequest"
            example:
              status: "CLOSED"
              updatedBy: "user-uuid"
      responses:
        "200":
          description: Updated closure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClosureResponse"
  
  /closures/{id}/finalize:
    post:
      tags: [Closures]
      summary: Finalize closure
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinalizeClosureRequest'
            example:
              updatedBy: "user-uuid"
      responses:
        '200':
          description: Finalized closure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClosureResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AdjustStockRequest:
      type: object
      properties:
        productId:
          type: string
        storeId:
          type: string
        amount:
          type: integer
      required: [productId, storeId, amount]

    CancelOrderRequest:
      type: object
      properties:
        reason:
          type: string
      required: [reason]

    CreateClosureRequest:
      type: object
      properties:
        storeId:
          type: string
        userId:
          type: string
        closureDate:
          type: string
          format: date
        startDatetime:
          type: string
          format: date-time
        endDatetime:
          type: string
          format: date-time
      required: [storeId, userId, closureDate, startDatetime, endDatetime]

    CreateOrderItemRequest:
      type: object
      properties:
        productId:
          type: string
        quantity:
          type: integer
      required: [productId, quantity]

    CreateOrderRequest:
      type: object
      properties:
        storeId:
          type: string
        userId:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/CreateOrderItemRequest"
        orderType:
          type: string
        paymentMethod:
          type: string
      required: [storeId, userId, items, orderType, paymentMethod]

    PayOrderRequest:
      type: object
      properties:
        paymentAmount:
          type: number
          format: decimal
        paymentMethod:
          type: string
      required: [paymentAmount, paymentMethod]

    UpdateStockRequest:
      type: object
      properties:
        productId:
          type: string
        storeId:
          type: string
        quantity:
          type: integer
      required: [productId, storeId, quantity]

    ClosureResponse:
      type: object
      properties:
        id:
          type: string
        storeId:
          type: string
        userId:
          type: string
        closureDate:
          type: string
          format: date
        startDatetime:
          type: string
          format: date-time
        endDatetime:
          type: string
          format: date-time
        totalSales:
          type: number
          format: decimal
        totalCash:
          type: number
          format: decimal
        totalCard:
          type: number
          format: decimal
        totalOther:
          type: number
          format: decimal
        totalOrders:
          type: integer
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    InventoryResponse:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        storeId:
          type: string
        quantity:
          type: integer
        status:
          type: string
        updatedAt:
          type: string

    OrderItemResponse:
      type: object
      properties:
        id:
          type: string
        orderId:
          type: string
        productId:
          type: string
        quantity:
          type: integer
        price:
          type: number
          format: decimal
        total:
          type: number
          format: decimal

    OrderResponse:
      type: object
      properties:
        id:
          type: string
        storeId:
          type: string
        userId:
          type: string
        status:
          type: string
        totalAmount:
          type: number
          format: decimal
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemResponse"

    OrderSummaryResponse:
      type: object
      properties:
        id:
          type: string
        storeId:
          type: string
        userId:
          type: string
        status:
          type: string
        totalAmount:
          type: number
          format: decimal
        createdAt:
          type: string
          format: date-time

    UpdateClosureStatusRequest:
      type: object
      properties:
        status:
          type: string
        updatedBy:
          type: string
      required: [status, updatedBy]

    FinalizeClosureRequest:
      type: object
      properties:
        updatedBy:
          type: string
      required: [updatedBy]
