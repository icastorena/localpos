openapi: 3.0.3
info:
  title: LocalPOS Reporting Service API
  version: 1.0.0
  description: |
    This API manages sales reports generated by stores.
    All endpoints require JWT Bearer authentication.

servers:
  - url: http://localhost:8086/api/v1
    description: Base URL for Reporting Service API

security:
  - bearerAuth: []

tags:
  - name: Reporting
    description: Endpoints for accessing generated reports

paths:
  /reports:
    get:
      tags: [Reporting]
      summary: List sales reports by store and date range
      parameters:
        - in: query
          name: storeId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: startDate
          required: false
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: A list of sales reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SalesReportResponse'
              example:
                - id: "123e4567-e89b-12d3-a456-426614174000"
                  storeId: "1bb3b69f-62d2-4b52-b8c2-8355057e8d60"
                  reportDate: "2025-07-22"
                  totalSales: 1500.75
                  totalOrders: 120
                  generatedBy: "manager1"
                  reportType: "sales"
                  comments: "Good performance"
                  createdAt: "2025-07-22T23:59:00Z"
                  updatedAt: "2025-07-23T00:00:00Z"

  /reports/{reportId}:
    get:
      tags: [Reporting]
      summary: Get a single sales report by ID
      parameters:
        - in: path
          name: reportId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Sales report details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesReportResponse'
              example:
                id: "123e4567-e89b-12d3-a456-426614174000"
                storeId: "1bb3b69f-62d2-4b52-b8c2-8355057e8d60"
                reportDate: "2025-07-22"
                totalSales: 1500.75
                totalOrders: 120
                generatedBy: "manager1"
                reportType: "sales"
                comments: "Good performance"
                createdAt: "2025-07-22T23:59:00Z"
                updatedAt: "2025-07-23T00:00:00Z"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SalesReportResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        storeId:
          type: string
          format: uuid
        reportDate:
          type: string
          format: date
        totalSales:
          type: number
          format: decimal
        totalOrders:
          type: integer
        generatedBy:
          type: string
        reportType:
          type: string
        comments:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - storeId
        - reportDate
        - totalSales
        - totalOrders
        - createdAt
