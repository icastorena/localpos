openapi: 3.0.3
info:
  title: LocalPOS Product Service API
  version: 1.0.0
  description: |
    This API manages products and categories for the LocalPOS system.
    It supports CRUD operations on products and allows category linking.
    All endpoints require JWT Bearer authentication.

servers:
  - url: 'http://localhost:8083/api/v1'
    description: Base URL for API requests

security:
  - bearerAuth: []

tags:
  - name: Products
    description: Product and barcode operations

paths:
  /products:
    get:
      summary: Retrieve all products
      description: Returns a list of all available products.
      operationId: getAllProducts
      tags:
        - Products
      responses:
        '200':
          description: A list of product objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductResponse'
      security:
        - bearerAuth: []

    post:
      summary: Create a new product
      description: Creates a product with name, SKU, barcode, price, and category ID.
      operationId: createProduct
      tags:
        - Products
      requestBody:
        description: Product details to create
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '200':
          description: Created product object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
      security:
        - bearerAuth: []

  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The product ID (UUID as string)
        schema:
          type: string
    get:
      summary: Retrieve a product by ID
      description: Returns product details for the specified ID.
      operationId: getProductById
      tags:
        - Products
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
      security:
        - bearerAuth: []

    put:
      summary: Update an existing product
      description: Updates product name, description, SKU, barcode, price, or category.
      operationId: updateProduct
      tags:
        - Products
      requestBody:
        description: Product details to update
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '200':
          description: Updated product object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
      security:
        - bearerAuth: []

    delete:
      summary: Delete a product
      description: Deletes a product by its ID.
      operationId: deleteProduct
      tags:
        - Products
      responses:
        '204':
          description: Product successfully deleted (no content)
      security:
        - bearerAuth: []

  /products/barcode/{code}:
    parameters:
      - name: code
        in: path
        required: true
        description: Barcode used to identify the product
        schema:
          type: string
    get:
      summary: Retrieve a product by barcode
      description: Returns the product details for a given barcode.
      operationId: getProductByBarcode
      tags:
        - Products
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          description: Product not found
      security:
        - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ProductRequest:
      type: object
      description: Data required to create or update a product
      properties:
        name:
          type: string
          maxLength: 255
          example: "Coffee"
        sku:
          type: string
          maxLength: 50
          example: "SKU-COF-001"
        barcode:
          type: string
          maxLength: 20
          example: "7500000000013"
        description:
          type: string
          maxLength: 1000
          nullable: true
          example: "Fresh brewed coffee"
        price:
          type: number
          format: decimal
          example: 2.50
        categoryId:
          type: string
          description: UUID of the product's category
          example: "c9aef7db-5d9e-4a3b-b326-1c3f4d831f8b"
      required:
        - name
        - sku
        - barcode
        - price
        - categoryId

    ProductResponse:
      type: object
      description: Returned product object with full category details
      properties:
        id:
          type: string
          format: uuid
          example: "7eaba064-6513-4b93-8568-7f1ee49d91a5"
        name:
          type: string
          example: "Coffee"
        sku:
          type: string
          example: "SKU-COF-001"
        barcode:
          type: string
          example: "7500000000013"
        description:
          type: string
          nullable: true
          example: "Fresh brewed coffee"
        price:
          type: number
          format: decimal
          example: 2.50
        category:
          $ref: '#/components/schemas/CategoryResponse'
        createdAt:
          type: string
          format: date-time
          example: "2025-07-03T14:22:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2025-07-03T14:22:30Z"
      required:
        - id
        - name
        - sku
        - barcode
        - price
        - category
        - createdAt
        - updatedAt

    CategoryResponse:
      type: object
      description: Category details for a product
      properties:
        id:
          type: string
          format: uuid
          example: "c9aef7db-5d9e-4a3b-b326-1c3f4d831f8b"
        name:
          type: string
          example: "Beverages"
        description:
          type: string
          nullable: true
          example: "Drinks and refreshments"
      required:
        - id
        - name
