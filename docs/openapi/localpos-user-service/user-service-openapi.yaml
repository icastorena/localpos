  openapi: 3.0.3
  info:
    title: LocalPOS User Service API
    version: 1.0.0
    description: |
      This API manages users, roles, and authentication for the LocalPOS system.
      It supports CRUD operations on users and login validation.
      All endpoints except the user validation require JWT Bearer authentication.

  servers:
    - url: 'http://localhost:8082/api/v1'
      description: Base URL for User Service API

  security:
    - bearerAuth: []

  tags:
    - name: Users
      description: User management operations
    - name: Authentication
      description: Login and credential validation
    - name: Roles
      description: Role listing
    - name: Stores
      description: Store listing

  paths:
    /users:
      get:
        tags: [Users]
        summary: Retrieve all users
        description: Returns a list of all users. Requires roles OWNER or ADMIN.
        responses:
          '200':
            description: A list of user objects
            content:
              application/json:
                schema:
                  type: array
                  items:
                    $ref: '#/components/schemas/UserResponse'
        security:
          - bearerAuth: []

      post:
        tags: [Users]
        summary: Create a new user
        description: Creates a user. Requires roles OWNER, ADMIN, or MANAGER.
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRequest'
        responses:
          '200':
            description: Created user object
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/UserResponse'
        security:
          - bearerAuth: []

    /users/{id}:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      get:
        tags: [Users]
        summary: Retrieve a user by ID
        description: Requires roles OWNER, ADMIN, or MANAGER.
        responses:
          '200':
            description: User details
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/UserResponse'
        security:
          - bearerAuth: []

      put:
        tags: [Users]
        summary: Update a user
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRequest'
        responses:
          '200':
            description: Updated user
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/UserResponse'
        security:
          - bearerAuth: []

      delete:
        tags: [Users]
        summary: Delete a user
        responses:
          '204':
            description: User successfully deleted
        security:
          - bearerAuth: []

    /auth/validate:
      post:
        tags: [Authentication]
        summary: Validate user credentials
        description: Validates username and password. This endpoint does NOT require authentication.
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginRequest'
        responses:
          '200':
            description: User details if valid
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/UserResponse'
        security: []

    /roles:
      get:
        tags: [Roles]
        summary: Retrieve all roles
        responses:
          '200':
            description: A list of roles
            content:
              application/json:
                schema:
                  type: array
                  items:
                    $ref: '#/components/schemas/RoleResponse'
        security:
          - bearerAuth: []

    /stores:
      get:
        tags: [Stores]
        summary: Retrieve all stores
        responses:
          '200':
            description: A list of stores
            content:
              application/json:
                schema:
                  type: array
                  items:
                    $ref: '#/components/schemas/StoreResponse'
        security:
          - bearerAuth: []

  components:
    securitySchemes:
      bearerAuth:
        type: http
        scheme: bearer
        bearerFormat: JWT

    schemas:
      LoginRequest:
        type: object
        properties:
          username:
            type: string
            example: john.doe
          password:
            type: string
            format: password
            example: P@ssw0rd!
        required: [username, password]

      RoleResponse:
        type: object
        properties:
          id:
            type: string
            format: uuid
            example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          name:
            type: string
            example: ADMIN
          description:
            type: string
            example: Administrator with full permissions
        required: [id, name]
        example:
          id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
          name: "ADMIN"
          description: "Administrator with full permissions"

      StoreResponse:
        type: object
        properties:
          id:
            type: string
            format: uuid
          code:
            type: string
          name:
            type: string
          address:
            type: string
          createdAt:
            type: string
            format: date-time
          updatedAt:
            type: string
            format: date-time
        required: [id, code, name, createdAt, updatedAt]
        example:
          id: "1bb3b69f-62d2-4b52-b8c2-8355057e8d60"
          code: "MAIN"
          name: "Main Branch"
          address: "123 Main St, Cityville"
          createdAt: "2025-01-01T12:00:00Z"
          updatedAt: "2025-06-01T12:00:00Z"

      UserRequest:
        type: object
        properties:
          username:
            type: string
          email:
            type: string
            format: email
          password:
            type: string
          storeCodes:
            type: array
            items:
              type: string
          roleNames:
            type: array
            items:
              type: string
          firstName:
            type: string
          lastName:
            type: string
          phone:
            type: string
          address:
            type: string
          isActive:
            type: boolean
        required: [username, email, password, storeCodes, roleNames, firstName, lastName, isActive]
        example:
          username: "john.doe"
          email: "john.doe@example.com"
          password: "P@ssw0rd!"
          storeCodes: ["MAIN"]
          roleNames: ["ADMIN"]
          firstName: "John"
          lastName: "Doe"
          phone: "6141234567"
          address: "123 Main St"
          isActive: true

      UserResponse:
        type: object
        properties:
          id:
            type: string
          username:
            type: string
          email:
            type: string
          firstName:
            type: string
          lastName:
            type: string
          phone:
            type: string
          address:
            type: string
          isActive:
            type: boolean
          stores:
            type: array
            items:
              $ref: '#/components/schemas/StoreResponse'
          roles:
            type: array
            items:
              $ref: '#/components/schemas/RoleResponse'
          createdAt:
            type: string
            format: date-time
          updatedAt:
            type: string
            format: date-time
        required: [id, username, isActive, createdAt, updatedAt]
        example:
          id: "8eec95c3-0b96-4b1b-9216-6a3a6f441b54"
          username: "john.doe"
          email: "john.doe@example.com"
          firstName: "John"
          lastName: "Doe"
          phone: "6141234567"
          address: "123 Main St"
          isActive: true
          stores:
            - id: "1bb3b69f-62d2-4b52-b8c2-8355057e8d60"
              code: "MAIN"
              name: "Main Branch"
              address: "123 Main St, Cityville"
              createdAt: "2025-01-01T12:00:00Z"
              updatedAt: "2025-06-01T12:00:00Z"
          roles:
            - id: "d1b6b1b4-3c4a-4a4c-8d2a-9c6a4f40e523"
              name: "ADMIN"
              description: "Administrator with full permissions"
          createdAt: "2025-01-01T12:00:00Z"
          updatedAt: "2025-06-01T12:00:00Z"
